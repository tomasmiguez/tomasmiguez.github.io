{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{- if .Pages }}
  <ul class="post-list">
    {{- range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      <time datetime="{{ .Date | time.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
      {{- with .Summary }}<p>{{ . }}</p>{{ end }}
    </li>
    {{- end }}
  </ul>
  {{- else }}
  <p class="muted">Nothing here yet.</p>
  {{- end }}
{{ end }}
