{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <p class="post-meta">
      {{- with .Date }}<time datetime="{{ . | time.Format "2006-01-02" }}">{{ . | time.Format ":date_long" }}</time>{{ end }}
      {{- with .GetTerms "tags" }}<span class="post-tags">{{ range . }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</span>{{ end }}
    </p>
    {{- with .Description }}<p class="post-lead">{{ . }}</p>{{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
